appId: com.michael.rebeccalisten
productName: Rebecca Listen
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,*.tsbuildinfo}'
  # Solo desarrollo: plan, fuente del sidecar (native/target pesa cientos de MB), scripts y tests.
  - '!{plan,native,scripts,dist}/**'
  - '!{CLAUDE.md,vitest.config.ts}'
asarUnpack:
  # El sidecar (resources/bin/rl-capture.exe) y ffmpeg no se pueden ejecutar desde dentro del asar;
  # main los busca en app.asar.unpacked.
  - resources/**
  - node_modules/ffmpeg-static/**
# Solo Windows: el sidecar de captura es WASAPI (rl-capture.exe).
# D3: sin firmar; SmartScreen avisa en la primera instalación.
win:
  executableName: RebeccaListen
  target:
    - target: nsis
      arch: x64
nsis:
  # Instalador asistido: permite elegir carpeta; accesos directos en escritorio y menú Inicio.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  artifactName: ${name}-${version}-setup.${ext}
  # userData (historial y ajustes) se conserva al desinstalar.
  deleteAppDataOnUninstall: false
npmRebuild: false
# Releases en GitHub (D2, tarea 44). `draft`: se publica a mano tras revisarlo.
publish:
  provider: github
  owner: Miiichael6
  repo: rebecca_listen
  releaseType: draft
